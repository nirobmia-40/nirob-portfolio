<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFCF9" />
      <stop offset="100%" stop-color="#EAE3D8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2A23" />
      <stop offset="100%" stop-color="#604536" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2B211C" flood-opacity="0.1" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle background grid lines -->
  <line x1="100" y1="0" x2="100" y2="500" stroke="#D8CABB" stroke-width="1" stroke-dasharray="4 8" opacity="0.6" />
  <line x1="700" y1="0" x2="700" y2="500" stroke="#D8CABB" stroke-width="1" stroke-dasharray="4 8" opacity="0.6" />
  <line x1="0" y1="120" x2="800" y2="120" stroke="#D8CABB" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />
  
  <!-- Reader Card Frame -->
  <g filter="url(#shadow)">
    <rect x="180" y="80" width="440" height="340" rx="16" fill="#F7F4EE" stroke="#D8CABB" stroke-width="2" />
    
    <!-- Top Bar -->
    <rect x="180" y="80" width="440" height="48" rx="16" fill="#EAE3D8" />
    <circle cx="210" cy="104" r="6" fill="#8B654E" />
    <circle cx="230" cy="104" r="6" fill="#B58B68" />
    <circle cx="250" cy="104" r="6" fill="#D8CABB" />
    <text x="400" y="110" font-family="sans-serif" font-size="13" font-weight="600" fill="#604536" text-anchor="middle" letter-spacing="1">ODHYAY READER</text>
    
    <!-- Book / Chapter Layout -->
    <!-- Left Column -->
    <rect x="210" y="150" width="180" height="24" rx="4" fill="#3B2A23" />
    <text x="220" y="167" font-family="serif" font-size="13" font-weight="bold" fill="#F7F4EE">Chapter 01: Foundations</text>
    <rect x="210" y="190" width="170" height="8" rx="4" fill="#8B654E" opacity="0.7" />
    <rect x="210" y="206" width="150" height="8" rx="4" fill="#B58B68" opacity="0.5" />
    <rect x="210" y="222" width="165" height="8" rx="4" fill="#B58B68" opacity="0.5" />
    <rect x="210" y="238" width="130" height="8" rx="4" fill="#B58B68" opacity="0.5" />
    
    <rect x="210" y="265" width="180" height="20" rx="4" fill="#EAE3D8" />
    <text x="220" y="279" font-family="serif" font-size="11" font-weight="600" fill="#604536">Chapter 02: Curiosity</text>
    <rect x="210" y="295" width="170" height="8" rx="4" fill="#B58B68" opacity="0.5" />
    <rect x="210" y="311" width="140" height="8" rx="4" fill="#B58B68" opacity="0.5" />
    
    <!-- Right Column: Reading Preview -->
    <rect x="410" y="150" width="180" height="230" rx="10" fill="#FDFCF9" stroke="#EAE3D8" stroke-width="1.5" />
    <circle cx="500" cy="200" r="32" fill="#3B2A23" />
    <!-- Open Book Icon -->
    <path d="M485 198 C492 194, 498 194, 500 197 C502 194, 508 194, 515 198 V212 C508 208, 502 208, 500 211 C498 208, 492 208, 485 212 Z" fill="#F7F4EE" />
    
    <text x="500" y="255" font-family="serif" font-size="14" font-weight="bold" fill="#2B211C" text-anchor="middle">Accessible Knowledge</text>
    <text x="500" y="275" font-family="sans-serif" font-size="11" fill="#756D65" text-anchor="middle">Curated for curious minds</text>
    
    <rect x="440" y="300" width="120" height="32" rx="6" fill="#604536" />
    <text x="500" y="321" font-family="sans-serif" font-size="11" font-weight="600" fill="#F7F4EE" text-anchor="middle">Read Chapter</text>
  </g>
</svg>
