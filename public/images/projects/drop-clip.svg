<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFCF9" />
      <stop offset="100%" stop-color="#EAE3D8" />
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B2A23" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad5)" />
  
  <g filter="url(#shadow5)">
    <rect x="180" y="75" width="440" height="350" rx="18" fill="#F7F4EE" stroke="#D8CABB" stroke-width="2" />
    
    <!-- Top Bar -->
    <rect x="180" y="75" width="440" height="50" rx="18" fill="#EAE3D8" />
    <circle cx="210" cy="100" r="5" fill="#8B654E" />
    <circle cx="225" cy="100" r="5" fill="#B58B68" />
    <circle cx="240" cy="100" r="5" fill="#D8CABB" />
    <text x="400" y="106" font-family="sans-serif" font-size="12" font-weight="600" fill="#604536" text-anchor="middle" letter-spacing="1">DROP CLIP HUB</text>
    
    <!-- Radar / Transfer Center -->
    <circle cx="400" cy="220" r="90" fill="none" stroke="#D8CABB" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="400" cy="220" r="60" fill="none" stroke="#B58B68" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="400" cy="220" r="34" fill="#3B2A23" />
    
    <!-- Send/Receive icon -->
    <path d="M400 205 L400 235 M400 205 L392 214 M400 205 L408 214" stroke="#F7F4EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Orbiting Devices / Clips -->
    <g transform="translate(290, 150)">
      <rect x="0" y="0" width="45" height="30" rx="4" fill="#604536" />
      <text x="22" y="18" font-family="sans-serif" font-size="8" fill="#F7F4EE" text-anchor="middle">.MP4</text>
    </g>
    
    <g transform="translate(470, 160)">
      <rect x="0" y="0" width="45" height="30" rx="4" fill="#8B654E" />
      <text x="22" y="18" font-family="sans-serif" font-size="8" fill="#F7F4EE" text-anchor="middle">.MOV</text>
    </g>
    
    <g transform="translate(320, 290)">
      <rect x="0" y="0" width="45" height="30" rx="4" fill="#8B654E" />
      <text x="22" y="18" font-family="sans-serif" font-size="8" fill="#F7F4EE" text-anchor="middle">CLIP #1</text>
    </g>
    
    <g transform="translate(450, 280)">
      <rect x="0" y="0" width="45" height="30" rx="4" fill="#604536" />
      <text x="22" y="18" font-family="sans-serif" font-size="8" fill="#F7F4EE" text-anchor="middle">CLIP #2</text>
    </g>
    
    <!-- Bottom status bar -->
    <rect x="230" y="360" width="340" height="38" rx="8" fill="#EAE3D8" stroke="#D8CABB" stroke-width="1" />
    <circle cx="255" cy="379" r="4" fill="#8B654E" />
    <text x="270" y="383" font-family="sans-serif" font-size="11" font-weight="500" fill="#3B2A23">Instant Creator Media Handshake — Ready</text>
  </g>
</svg>
