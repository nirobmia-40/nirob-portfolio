<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B211C" />
      <stop offset="100%" stop-color="#3B2A23" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad2)" />
  
  <g filter="url(#shadow2)">
    <!-- Dashboard Card -->
    <rect x="160" y="70" width="480" height="360" rx="18" fill="#181715" stroke="#604536" stroke-width="2" />
    
    <!-- Top bar -->
    <rect x="160" y="70" width="480" height="50" rx="18" fill="#242321" />
    <circle cx="190" cy="95" r="5" fill="#B58B68" />
    <circle cx="205" cy="95" r="5" fill="#8B654E" />
    <circle cx="220" cy="95" r="5" fill="#604536" />
    <text x="400" y="101" font-family="sans-serif" font-size="12" font-weight="600" fill="#EAE3D8" text-anchor="middle" letter-spacing="1">THE DROPOUT COLLEGE</text>
    
    <!-- Network Hub Grid -->
    <g transform="translate(190, 140)">
      <!-- Central Node -->
      <circle cx="210" cy="120" r="44" fill="#3B2A23" stroke="#B58B68" stroke-width="2" />
      <path d="M195 120 L210 108 L225 120 L210 132 Z" fill="#F7F4EE" />
      <line x1="225" y1="120" x2="225" y2="135" stroke="#F7F4EE" stroke-width="2" />
      
      <!-- Satellite Nodes -->
      <line x1="210" y1="76" x2="100" y2="40" stroke="#604536" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="254" y1="120" x2="330" y2="70" stroke="#604536" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="210" y1="164" x2="130" y2="200" stroke="#604536" stroke-width="2" stroke-dasharray="4 4" />
      <line x1="254" y1="135" x2="320" y2="190" stroke="#604536" stroke-width="2" stroke-dasharray="4 4" />
      
      <!-- Node 1 -->
      <circle cx="100" cy="40" r="28" fill="#242321" stroke="#8B654E" stroke-width="1.5" />
      <text x="100" y="44" font-family="sans-serif" font-size="9" font-weight="bold" fill="#F7F4EE" text-anchor="middle">BUILD</text>
      
      <!-- Node 2 -->
      <circle cx="330" cy="70" r="28" fill="#242321" stroke="#8B654E" stroke-width="1.5" />
      <text x="330" y="74" font-family="sans-serif" font-size="9" font-weight="bold" fill="#F7F4EE" text-anchor="middle">LEARN</text>
      
      <!-- Node 3 -->
      <circle cx="130" cy="200" r="28" fill="#242321" stroke="#8B654E" stroke-width="1.5" />
      <text x="130" y="204" font-family="sans-serif" font-size="9" font-weight="bold" fill="#F7F4EE" text-anchor="middle">SHARE</text>
      
      <!-- Node 4 -->
      <circle cx="320" cy="190" r="28" fill="#242321" stroke="#8B654E" stroke-width="1.5" />
      <text x="320" y="194" font-family="sans-serif" font-size="9" font-weight="bold" fill="#F7F4EE" text-anchor="middle">SCALE</text>
    </g>
    
    <text x="400" y="390" font-family="serif" font-size="15" fill="#F7F4EE" text-anchor="middle">Independent Learning Community</text>
  </g>
</svg>
